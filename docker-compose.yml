services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jira_pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jira_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jira_pm
      SECRET_KEY: local-dev-secret
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
